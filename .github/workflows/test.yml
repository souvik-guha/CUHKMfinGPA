name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - name: Exact-arithmetic audit
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
